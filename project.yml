# XcodeGen project definition. Regenerate with `make xcodeproj` (or `xcodegen
# generate`) after running `make whisper`, which produces the static libraries in
# lib/ that this project links against.
#
# Sources are globbed from the Lyra/ directory, so new Swift files are picked up
# automatically and cannot drift out of sync with the Makefile's file list. The
# Makefile remains the reference build; this project exists so the app can be run,
# debugged and unit-tested (LyraTests, XCTest) inside Xcode.
name: Lyra
options:
  bundleIdPrefix: com.lyra
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "12.0"

targets:
  Lyra:
    type: application
    platform: macOS
    sources:
      - path: Lyra
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyra.Lyra
        INFOPLIST_FILE: Lyra/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lyra/Lyra.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Lyra/Lyra-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/lib"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/lib"
        OTHER_LDFLAGS:
          - "-lwhisper"
          - "-lggml"
          - "-lggml-base"
          - "-lggml-cpu"
          - "-lggml-metal"
          - "-lggml-blas"
          - "-lc++"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    # The Makefile generates the app icon and menu bar icon at package time.
    # Mirror that here so an Xcode build produces an app with the same resources.
    preBuildScripts:
      - name: Generate icons
        basedOnDependencyAnalysis: false
        script: |
          set -e
          TOOLS="$DERIVED_FILE_DIR/icon-tools"
          mkdir -p "$TOOLS"
          xcrun swiftc -O "$PROJECT_DIR/scripts/generate_app_icon.swift" -o "$TOOLS/app_icon_tool"
          xcrun swiftc -O "$PROJECT_DIR/scripts/generate_icons.swift" -o "$TOOLS/icon_tool"
          RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RES"
          "$TOOLS/app_icon_tool" "$RES"
          "$TOOLS/icon_tool" "$RES"
          cp -f "$PROJECT_DIR/assets/lyra-symbol.svg" "$RES/LyraConstellation.svg" || true
          cp -f "$PROJECT_DIR/assets/lyra.svg" "$RES/lyra.svg" || true
    dependencies:
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: ServiceManagement.framework
      - sdk: Security.framework
    info:
      path: Lyra/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Lyra needs microphone access to capture your voice for speech-to-text transcription."
        NSPrincipalClass: NSApplication
        CFBundleIconFile: AppIcon
    entitlements:
      path: Lyra/Lyra.entitlements
      properties:
        com.apple.security.device.audio-input: true

  LyraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LyraTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyra.LyraTests
        GENERATE_INFOPLIST_FILE: YES
        # LyraTests uses `@testable import Lyra`, which needs the app module
        # built with testability enabled.
        ENABLE_TESTABILITY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Lyra/Lyra-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/lib"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/lib"
    dependencies:
      - target: Lyra
